<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">

    <h1>Edit Agency</h1>

    <form th:action="@{/agencies/update}" method="post" th:object="${agency}">

        <input type="hidden" th:field="*{id}"/>

        <div>
            <label>Name</label>
            <input type="text" th:field="*{name}">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div>
            <label>City</label>
            <input type="text" th:field="*{cityName}">
            <div th:if="${#fields.hasErrors('cityName')}" th:errors="*{cityName}"></div>
        </div>

        <div>
            <label>Address</label>
            <input type="text" th:field="*{address}">
            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div>
            <label>Tel</label>
            <input type="text" th:field="*{tel}">
            <div th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"></div>
        </div>

        <button type="submit">Update</button>
        <a th:href="@{/agencies}">Cancel</a>

    </form>

</div>
</html>
