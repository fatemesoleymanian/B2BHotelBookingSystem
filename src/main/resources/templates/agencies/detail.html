<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">

<h1 th:text="${agency.name}">Agency Name</h1>

<p><strong>City:</strong> <span th:text="${agency.cityName}"></span></p>
<p><strong>Address:</strong> <span th:text="${agency.address}"></span></p>
<p><strong>Tel:</strong> <span th:text="${agency.tel}"></span></p>


<hr>

<a th:href="@{/agencies}">Back to list</a>

</div>
</html>
