<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">
<h1>Edit Hotel</h1>

<form th:action="@{/hotels/{id}(id=${hotel.id})}"
      method="post"
      th:object="${hotel}">

    <div>
        <label>Name</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div>
        <label>City</label>
        <input type="text" th:field="*{cityName}" required>
    </div>

    <div>
        <label>Address</label>
        <input type="text" th:field="*{address}">
    </div>

    <div>
        <label>Stars</label>
        <input type="number" min="1" max="5" th:field="*{star}" required>
    </div>

    <div>
        <label>Tel</label>
        <input type="text" th:field="*{tel}">
    </div>

    <button type="submit">Update</button>
</form>

<a th:href="@{/hotels/{id}(id=${hotel.id})}">Cancel</a>

</div>
</html>
