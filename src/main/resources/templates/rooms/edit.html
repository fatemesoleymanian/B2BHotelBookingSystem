<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">

    <h1>Edit Room</h1>

    <form th:action="@{/rooms/{id}(id=${room.id})}"
          method="post" th:object="${room}">

        <label>Title</label><br>
        <input type="text" th:field="*{title}"><br><br>

        <label>Room Type</label><br>
        <select th:field="*{roomType}">
            <option th:each="type : ${roomTypes}"
                    th:value="${type}"
                    th:text="${type}">
            </option>
        </select><br><br>

        <label>Main Capacity</label><br>
        <input type="number" th:field="*{mainCapacity}"><br><br>

        <label>Child Capacity</label><br>
        <input type="number" th:field="*{childCapacity}"><br><br>

        <label>Price</label><br>
        <input type="number" step="0.01" th:field="*{price}"><br><br>

        <label>
            <input type="checkbox" th:field="*{active}">
            Active
        </label><br><br>

        <button type="submit">Update</button>
        <a th:href="@{/rooms}">Back</a>

    </form>

</div>
</html>
