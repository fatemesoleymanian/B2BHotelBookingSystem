<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">

    <h1>Reservation Detail</h1>

    <p><strong>ID:</strong> <span th:text="${reservation.id}"></span></p>
    <p><strong>Status:</strong> <span th:text="${reservation.status}"></span></p>

    <hr>

    <h3>Guest Info</h3>
    <p><strong>Name:</strong> <span th:text="${reservation.guestName}"></span></p>
    <p><strong>Phone:</strong> <span th:text="${reservation.guestPhoneNumber}"></span></p>

    <hr>

    <h3>Hotel & Room</h3>
    <p><strong>Hotel:</strong> <span th:text="${reservation.hotel.name}"></span></p>
    <p><strong>Room Type:</strong> <span th:text="${reservation.roomType}"></span></p>

    <hr>

    <h3>Date</h3>
    <p><strong>From:</strong> <span th:text="${reservation.from}"></span></p>
    <p><strong>To:</strong> <span th:text="${reservation.to}"></span></p>

    <hr>

    <h3>Pricing</h3>
    <p><strong>Rate:</strong>
        <span th:text="${reservation.rate != null ? reservation.rate.price : reservation.room.price}">
        </span>
    </p>
    <p><strong>Total:</strong> <span th:text="${reservation.totalPrice}"></span></p>

</div>
</html>
