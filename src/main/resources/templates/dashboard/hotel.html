<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: body">

<div th:fragment="content">

<h1>Hotel Dashboard</h1>

<div class="stats">
    <div>
        <h3>Active Rooms</h3>
        <span th:text="${activeRoomCount}">0</span>
    </div>

    <div>
        <h3>Today Reservations</h3>
        <span th:text="${todayReservations}">0</span>
    </div>

    <div>
        <h3>Pending Reservations</h3>
        <span th:text="${pendingReservations}">0</span>
    </div>
</div>

<hr>

<h2>Actions</h2>
<ul>
    <li><a th:href="@{/rooms}">Manage Rooms</a></li>
    <li><a th:href="@{/reservations}">View Reservations</a></li>
    <li><a th:href="@{/rates}">Manage Rates</a></li>
</ul>

</div>
</html>
